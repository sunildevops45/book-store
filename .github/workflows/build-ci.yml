name: Book-store ci-service

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to build"
        required: true
        type: choice
        options:
          - bookstore-account-service
          - bookstore-order-service
          - bookstore-catalog-service
          - bookstore-billing-service
          - bookstore-api-gateway-service
          - bookstore-eureka-discovery-service
          - bookstore-frontend-react-app
          - bookstore-payment-service
          - bookstore-commons

      image_tag:
        description: "Docker image tag"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # BACKEND
      - name: Set up JDK 8
        if: ${{ github.event.inputs.service != 'bookstore-frontend-react-app' }}
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build Java Service
        if: ${{ github.event.inputs.service != 'bookstore-frontend-react-app' }}
        working-directory: ${{ github.event.inputs.service }}
        run: mvn clean install -DskipTests

      # FRONTEND
      - name: Set up Node.js
        if: ${{ github.event.inputs.service == 'bookstore-frontend-react-app' }}
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build Frontend React App
        if: ${{ github.event.inputs.service == 'bookstore-frontend-react-app' }}
        working-directory: ${{ github.event.inputs.service }}
        run: |
          npm install
          npm run build

      # Login to DockerHub 
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        working-directory: ${{ github.event.inputs.service }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:${{ github.event.inputs.image_tag }} .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:${{ github.event.inputs.image_tag }}
