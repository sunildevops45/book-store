name: Java CI - Select Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to build"
        required: true
        type: choice
        options:
          - bookstore-account-service
          - bookstore-order-service
          - bookstore-catalog-service
          - bookstore-billing-service
          - bookstore-api-gateway-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Verify Java Version
        run: java -version

      - name: Build Selected Service
        working-directory: ${{ github.event.inputs.service }}
        run: mvn clean install
