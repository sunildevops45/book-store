name: Book-store CI-CD

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to build and deploy"
        required: true
        type: choice
        options:
          - bookstore-account-service
          - bookstore-order-service
          - bookstore-catalog-service
          - bookstore-billing-service
          - bookstore-api-gateway-service
          - bookstore-eureka-discovery-service
          - bookstore-payment-service
          - bookstore-frontend-react-app

      image_tag:
        description: "Docker Image Tag"
        required: true
        default: latest
        type: string

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 8
        if: ${{ github.event.inputs.service != 'bookstore-frontend-react-app' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build bookstore-commons
        if: ${{ github.event.inputs.service != 'bookstore-frontend-react-app' }}
        working-directory: bookstore-commons
        run: mvn -B clean install -DskipTests

      - name: Build bookstore-feign
        if: ${{ github.event.inputs.service != 'bookstore-frontend-react-app' }}
        working-directory: bookstore-feign
        run: mvn -B clean install -DskipTests

      - name: Build Java Service
        if: ${{ github.event.inputs.service != 'bookstore-frontend-react-app' }}
        working-directory: ${{ github.event.inputs.service }}
        run: mvn -B clean install -DskipTests

      - name: Setup Node
        if: ${{ github.event.inputs.service == 'bookstore-frontend-react-app' }}
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build React Application
        if: ${{ github.event.inputs.service == 'bookstore-frontend-react-app' }}
        working-directory: bookstore-frontend-react-app
        run: |
          npm install
          npm run build

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        working-directory: ${{ github.event.inputs.service }}
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:${{ github.event.inputs.image_tag }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:${{ github.event.inputs.image_tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: aks-rg
          cluster-name: bookstore-cluster

      - name: Deploy Application
        run: |
          kubectl apply -f ${{ github.event.inputs.service }}/${{ github.event.inputs.service }}.yaml

      - name: Deploy NGINX Ingress
        if: ${{ github.event.inputs.service == 'bookstore-api-gateway-service' }}
        run: |
          kubectl apply -f k8s/nginx.yaml

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/${{ github.event.inputs.service }} \
          ${{ github.event.inputs.service }}=${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:${{ github.event.inputs.image_tag }}

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/${{ github.event.inputs.service }} --timeout=300s

      - name: Verify Kubernetes Resources
        run: |
          kubectl get nodes
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc
          kubectl get ingress
